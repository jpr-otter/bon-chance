<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title class="card-title">
        <mat-icon class="title-icon">receipt</mat-icon>
        BonChance - Anmelden
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-Mail oder Benutzername</mat-label>
          <input
            matInput
            type="text"
            formControlName="login"
            placeholder="ihre@email.de oder benutzername"
          />
          <mat-error *ngIf="loginForm.get('login')?.hasError('required')">
            E-Mail oder Benutzername ist erforderlich
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Passwort</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Ihr Passwort"
          />
          <button
            type="button"
            matSuffix
            mat-icon-button
            (click)="hidePassword = !hidePassword"
          >
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Passwort ist erforderlich
          </mat-error>
        </mat-form-field>

        <div *ngIf="authService.error()" class="error-message">
          {{ authService.error() }}
          <button type="button" mat-icon-button (click)="authService.clearError()">
            <mat-icon>close</mat-icon>
          </button>
        </div>

        <div class="form-actions">
          <button
            type="submit"
            mat-raised-button
            color="primary"
            class="full-width login-button"
            [disabled]="loginForm.invalid || authService.isLoading()"
          >
            <mat-spinner
              *ngIf="authService.isLoading()"
              diameter="20"
              class="inline-spinner"
            ></mat-spinner>
            {{ authService.isLoading() ? 'Anmelden...' : 'Anmelden' }}
          </button>
        </div>
      </form>

      <div class="register-link">
        <p>
          Noch kein Konto?
          <a routerLink="/register" mat-button color="accent"> Jetzt registrieren </a>
        </p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
