version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bonchance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Message Queue (for future OCR service)
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # User Service
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bonchance
      JWT_SECRET: your-super-secret-key-change-this-in-production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/user-service:/app
      - /app/target

  # Receipt Service
  receipt-service:
    build:
      context: ./backend/receipt-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bonchance
      JWT_SECRET: your-super-secret-key-change-this-in-production
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/receipt-service:/app
      - /app/target

  # OCR Service
  ocr-service:
    build:
      context: ./backend/ocr-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    volumes:
      - ./backend/ocr-service:/app

  # API Gateway (will be created next)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    environment:
      USER_SERVICE_URL: http://user-service:3001
      RECEIPT_SERVICE_URL: http://receipt-service:3002
      JWT_SECRET: your-super-secret-key-change-this-in-production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - receipt-service

  # Frontend (Angular)
  frontend:
    build:
      context: ./bon-chance-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./bon-chance-frontend:/app
      - /app/node_modules
    environment:
      - API_BASE_URL=http://localhost:3000
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: